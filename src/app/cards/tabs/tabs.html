<div class="tab-list">
    <button
        [class.active]="activeTab === 'overview'"
        (click)="selectedTab('overview')">
        Overview
    </button>

    <button
        [class.active]="activeTab === 'tasks'"
        (click)="selectedTab('tasks')">
        Tasks
        <span class="num"> {{counts.iTasks}} </span>
    </button>

    <button
        [class.active]="activeTab === 'files'"
        (click)="selectedTab('files')">
        Files
        <span class="num"> {{counts.iFiles}} </span>
    </button>

    <button
        [class.active]="activeTab === 'brief'"
        (click)="selectedTab('brief')">
        Brief
    </button>

    <button
        [class.active]="activeTab === 'timeline'"
        (click)="selectedTab('timeline')">
        Timeline
    </button>

    <button
        [class.active]="activeTab === 'activity'"
        (click)="selectedTab('activity')">
        Activity
        <span class="num"> {{counts.iActivities}} </span>
    </button>

</div>
