<div class="data">

    <div class="data-row">
        <span class="head"> {{stats.oTasks.iTotalTasks}} <span>/{{stats.oTasks.iTaskCapacity}} </span></span>
        <span class="subhead">Tasks {{stats.oTasks.iDoneTasks}} done</span>
    </div>

    <div class="data-row">
        <span class="head"> {{stats.oTimeline.iDaysRemaining | solidDays}} <span>d</span></span>
        <span class="subhead">until Feb {{stats.oTimeline.iDeadline | date: 'dd, yyyy'}} </span>
    </div>

    <div class="data-row">
        <span class="head">$11k<span>/24k</span></span>
        <span class="subhead">Budget {{stats.oBudget.iUsedPercent}}% used</span>
    </div>

    <div class="data-row">
        <span class="head">2.3×<span class="ic"><mat-icon>trending_up</mat-icon></span></span>
        <span class="subhead">Traffic vs Baseline</span>
    </div>

</div>
