<div class="info">
    <div class="top">
    <span class="pro-ic">
        <mat-icon>trending_up</mat-icon>
    </span>

    <div class="stack">
    <div class="status">
        <button class="status-badge">
            <span class="status-dot"></span>
            {{header.vProjectStatusLabel}}
        </button>
        <i class="dot"></i>
        <span class="text">  {{header.iDaysRemaining | solidDays}} days to deadline</span>
        <i class="dot"></i>
        <span class="text">Started {{header.iStartDate | date:'mediumDate'}} </span>
    </div>

        <h1> {{header.vProjectName}} </h1>
        <span class="desc"> {{header.txDescription}} </span>
    
    </div>

    <div class="buttons">
        <button class="pin-btn">
            <mat-icon>star</mat-icon>
            Pin
        </button>
        <button class="open">
            <mat-icon>open_in_full</mat-icon>
            Share
        </button>
        <button class="add">
            <mat-icon>add</mat-icon>
            Add note
        </button>
    </div>
    </div>

    <div class="progress-bar">
        <div class="bar-details">
            <span class="pro-text">Project progress ·  {{header.iDoneTasks}} of {{header.iTotalTasks}} tasks done</span>
            <span class="pro-perc"> {{header.iProgressPercent}} <span class="perc-symbol">%</span></span>
        </div>
        <div class="ledger">
             <i class="l-fill" [style.width.%]="header.iProgressPercent"></i>
             <i class="l-empty"></i>
        </div>
    </div>
</div>
